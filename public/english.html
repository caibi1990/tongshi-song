<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>英语听力</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F7F9;--card:#FFFFFF;--text:#2D2D2D;--sub:#8B8B8B;
  --pri:#4A98F8;--pri2:#14CCAD;--pri-l:#E8F3FF;--pri-d:#2F7BD6;
  --accent:#F5A623;--accent-l:#FFF4E0;
  --ok:#14CCAD;--ok-l:#E3F9F4;--ok-d:#0E9E86;
  --danger:#EF5350;
  --r:18px;--rs:12px;--shadow:0 4px 16px rgba(0,0,0,.08);
  --grad:linear-gradient(135deg,#4A98F8,#14CCAD);
}
html{background:var(--bg)}
html,body{height:100%;font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:var(--text);font-size:16px;overflow:hidden;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;position:relative}

/* ===== Header ===== */
.header{padding:14px 20px 8px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header .back-link{color:var(--sub);text-decoration:none;font-size:14px;flex-shrink:0;min-height:44px;display:flex;align-items:center;cursor:pointer}
.header .back-link:active{color:var(--pri)}
.header h1{font-size:20px;font-weight:700;flex:1}
.header .streak{background:var(--accent-l);color:var(--accent);font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px;white-space:nowrap}

/* 顶部学习统计条 */
.topstats{display:flex;gap:10px;padding:4px 20px 12px;flex-shrink:0}
.topstats .stat{flex:1;background:var(--card);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.topstats .stat b{display:block;font-size:20px;color:var(--pri-d);line-height:1.2}
.topstats .stat span{font-size:11px;color:var(--sub)}
.topstats .stat .goal-mini{height:4px;background:#EEE;border-radius:2px;margin-top:6px;overflow:hidden}
.topstats .stat .goal-mini i{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .5s}

/* ===== Pages ===== */
.main{flex:1;overflow-y:auto;padding:4px 20px 120px;-webkit-overflow-scrolling:touch}
.page{display:none;animation:fadeIn .3s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 单元网格 ===== */
.unit-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:600px){.unit-grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.unit-grid{grid-template-columns:1fr 1fr 1fr}}
.unit-card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.unit-card:active{transform:scale(.97)}
.unit-card .ring-wrap{flex-shrink:0;width:68px;height:68px;position:relative}
.unit-card .ring-wrap .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--pri-d)}
.unit-card .uc-info{flex:1;min-width:0}
.unit-card .uc-title{font-size:19px;font-weight:700;margin-bottom:3px}
.unit-card .uc-sub{font-size:12px;color:var(--sub)}
.unit-card .uc-badge{position:absolute;top:12px;right:14px;font-size:22px;opacity:0;transform:scale(.5);transition:all .4s}
.unit-card.done .uc-badge{opacity:1;transform:scale(1)}
.unit-card.done{background:linear-gradient(135deg,#FFFDF5,#FFF8E8)}

/* 单词总表入口 */
.wordlist-entry{margin-top:20px;background:var(--grad);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);color:#fff;transition:transform .2s}
.wordlist-entry:active{transform:scale(.97)}
.wordlist-entry .wl-ico{font-size:30px}
.wordlist-entry .wl-info{flex:1}
.wordlist-entry .wl-title{font-size:17px;font-weight:700}
.wordlist-entry .wl-sub{font-size:12px;opacity:.85;margin-top:2px}
.wordlist-entry .wl-arrow{font-size:20px;opacity:.8}

/* ===== 单元学习路径 ===== */
.path{position:relative;padding:8px 0 8px 0}
.path-node{display:flex;align-items:center;gap:16px;padding:12px 4px;cursor:pointer;position:relative;border-radius:14px;transition:background .2s}
.path-node:active{background:var(--pri-l)}
.path-node .pn-dot{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#EEE;color:#AAA;position:relative;z-index:2;transition:all .3s;border:3px solid transparent}
.path-node.todo .pn-dot{background:#EFEFEF}
.path-node.current .pn-dot{background:var(--pri-l);border-color:var(--pri);color:var(--pri-d);transform:scale(1.12);box-shadow:0 0 0 4px rgba(74,152,248,.15)}
.path-node.done .pn-dot{background:var(--ok-l);border-color:var(--ok);color:var(--ok-d)}
.path-node .pn-body{flex:1;min-width:0}
.path-node .pn-title{font-size:16px;font-weight:600}
.path-node.todo .pn-title{color:var(--sub)}
.path-node .pn-sub{font-size:12px;color:var(--sub);margin-top:2px}
.path-node .pn-check{font-size:20px;color:var(--ok);opacity:0}
.path-node.done .pn-check{opacity:1}
/* 连接竖线 */
.path-node:not(:last-child)::after{content:"";position:absolute;left:29px;top:50%;width:3px;height:100%;background:#EEE;z-index:1}
.path-node.done:not(:last-child)::after{background:var(--ok)}

.unit-done-banner{margin-top:16px;background:var(--ok-l);border:2px dashed var(--ok);border-radius:var(--r);padding:18px;text-align:center;color:var(--ok-d)}
.unit-done-banner b{font-size:17px}
.unit-done-banner .practice-btn{margin-top:10px}

/* ===== 大播放器 ===== */
.player-stage{text-align:center;padding:10px 0}
.player-stage .ps-unit{font-size:13px;color:var(--pri-d);font-weight:600;letter-spacing:.5px}
.player-stage .ps-title{font-size:26px;font-weight:800;margin:4px 0 2px}
.player-stage .ps-ico{font-size:56px;margin:8px 0}
.waveform{height:64px;display:flex;align-items:flex-end;justify-content:center;gap:3px;margin:16px auto;max-width:280px}
.waveform .bar{width:5px;background:var(--grad);border-radius:3px;height:20%;transition:height .1s}
.bigplay{width:92px;height:92px;border-radius:50%;background:var(--grad);border:none;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:12px auto;cursor:pointer;box-shadow:0 8px 24px rgba(74,152,248,.4);transition:transform .15s}
.bigplay:active{transform:scale(.92)}
.bigplay.playing{animation:none}
.bigplay:not(.playing){animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 8px 24px rgba(74,152,248,.4)}50%{box-shadow:0 8px 32px rgba(74,152,248,.7)}}

.seekrow{display:flex;align-items:center;gap:10px;max-width:420px;margin:8px auto;padding:0 10px}
.seekrow .t{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:38px}
.seekbar{flex:1;position:relative;height:24px;display:flex;align-items:center;cursor:pointer}
.seekbar .track{width:100%;height:8px;background:#E5E5E5;border-radius:4px;overflow:hidden}
.seekbar .track i{display:block;height:100%;background:var(--grad);border-radius:4px;width:0%}
.seekbar .thumb{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--pri);transform:translate(-50%,-50%);left:0%;box-shadow:0 2px 6px rgba(0,0,0,.2)}
/* AB 区间高亮 */
.seekbar .abzone{position:absolute;top:50%;height:8px;transform:translateY(-50%);background:rgba(245,166,35,.45);border-radius:4px;display:none}

.ctrlrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px auto;flex-wrap:wrap;max-width:460px}
.ctrl-btn{min-width:56px;min-height:48px;padding:8px 12px;border-radius:14px;background:var(--card);border:1.5px solid #E5E5E5;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.ctrl-btn:active{transform:scale(.94)}
.ctrl-btn.active{background:var(--pri-l);border-color:var(--pri);color:var(--pri-d)}
.ctrl-btn .ci{font-size:18px;line-height:1}
.ctrl-btn .cl{font-size:10px;color:var(--sub)}
.ctrl-btn.active .cl{color:var(--pri-d)}

.speed-row{display:flex;gap:8px;justify-content:center;margin:8px auto}
.speed-row .sp{min-width:52px;min-height:40px;border-radius:12px;border:1.5px solid #E5E5E5;background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:var(--sub)}
.speed-row .sp.active{background:var(--pri);border-color:var(--pri);color:#fff}

/* ===== 迷你播放器 ===== */
.mini{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #EEE;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:12px;z-index:50;cursor:pointer}
.mini.show{display:flex}
.mini .m-ico{width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.mini .m-info{flex:1;min-width:0}
.mini .m-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .m-bar{height:4px;background:#E5E5E5;border-radius:2px;margin-top:5px;overflow:hidden}
.mini .m-bar i{display:block;height:100%;background:var(--grad);width:0%}
.mini .m-play{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:20px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mini .m-play:active{transform:scale(.92)}

/* ===== 引导页 ===== */
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:70vh;padding:20px}
.intro .hero{font-size:72px;margin-bottom:8px}
.intro h2{font-size:28px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.intro p{font-size:15px;color:var(--sub);line-height:1.7;max-width:320px;margin-bottom:28px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 40px;border-radius:16px;background:var(--grad);color:#fff;border:none;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(74,152,248,.4);min-height:56px;transition:transform .15s}
.btn-primary:active{transform:scale(.95)}
.practice-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border-radius:12px;background:var(--grad);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;min-height:48px}
.practice-btn:active{transform:scale(.95)}
.practice-btn:disabled{opacity:.5;cursor:not-allowed}

/* 提示条 */
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-20px);background:rgba(45,45,45,.94);color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:85%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 星星飞入 */
.star-fly{position:fixed;font-size:28px;z-index:300;pointer-events:none;animation:starFly 1s ease-out forwards}
@keyframes starFly{0%{opacity:0;transform:scale(.3) translateY(0)}30%{opacity:1;transform:scale(1.3) translateY(-10px)}100%{opacity:0;transform:scale(.8) translateY(-80px)}}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden;display:none}
.confetti.show{display:block}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.3}}

.section-title{font-size:13px;color:var(--sub);font-weight:600;margin:4px 0 10px;padding-left:2px}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header" id="header" style="display:none">
    <a class="back-link" id="backLink">‹ 返回</a>
    <h1 id="pageTitle">英语听力</h1>
    <span class="streak" id="streakBadge" style="display:none">🔥 0 天</span>
  </div>

  <!-- 顶部统计（仅单元选择页） -->
  <div class="topstats" id="topStats" style="display:none">
    <div class="stat">
      <b id="stToday">0</b><span>今日分钟</span>
      <div class="goal-mini"><i id="stGoalBar" style="width:0%"></i></div>
    </div>
    <div class="stat"><b id="stStreak">0</b><span>连续天数</span></div>
    <div class="stat"><b id="stDone">0/6</b><span>完成单元</span></div>
  </div>

  <div class="main" id="main"><!-- pages injected --></div>

  <!-- 迷你播放器 -->
  <div class="mini" id="mini">
    <div class="m-ico" id="miniIco">🎧</div>
    <div class="m-info">
      <div class="m-title" id="miniTitle">—</div>
      <div class="m-bar"><i id="miniBar"></i></div>
    </div>
    <button class="m-play" id="miniPlay" aria-label="播放/暂停">▶</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>

<script>
"use strict";
/* ============================================================
   英语听力训练助手  —  服务器托管版（音频放 /audio/english/）
   单文件 SPA：引导 / 单元选择 / 单元学习 / 大播放器 / 单词总表
   ============================================================ */

// ---------- 常量：单元与模块定义 ----------
const UNITS = [1,2,3,4,5,6];
const MODULES = [
  { key:'ready_go',    label:'Ready Go',    cn:'热身导入', ico:'🚀' },
  { key:'letters',     label:'Letters',     cn:'字母拼读', ico:'🔤' },
  { key:'words',       label:'Words',       cn:'核心单词', ico:'📚' },
  { key:'communicate', label:'Communicate', cn:'情景对话', ico:'💬' },
  { key:'story',       label:'Story',       cn:'故事听力', ico:'📖' },
  { key:'extend',      label:'Extend',      cn:'拓展延伸', ico:'🌟' },
];
const AUDIO_BASE = '/audio/english';
function audioUrl(unit, moduleKey){ return `${AUDIO_BASE}/unit${unit}/${moduleKey}.mp3`; }
const WORDLIST_URL = `${AUDIO_BASE}/wordlist.mp3`;

// ---------- 本地日期工具（规避 UTC+8 的 toISOString 偏差）----------
function todayStr(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysBetween(aStr, bStr){
  const a=new Date(aStr+'T00:00:00'), b=new Date(bStr+'T00:00:00');
  return Math.round((b-a)/86400000);
}

// ============================================================
//  StorageManager — localStorage 持久化
// ============================================================
const STORE_KEY = 'english-listening-tracker';
const Store = (()=>{
  const DEFAULT = ()=>({
    version:1,
    importDate:new Date().toISOString(),
    settings:{ dailyGoalMinutes:15, defaultPlaybackRate:0.75, autoAdvance:true, completionThreshold:0.80 },
    units:{},
    globalWordList:{ completed:false, playCount:0, totalListenTime:0, bookmarks:[] },
    dailyStats:{},
    streaks:{ current:0, longest:0, lastStudyDate:null },
    lastSession:null,
    introDone:false,
  });
  let data = load();
  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return DEFAULT();
      const d = JSON.parse(raw);
      return Object.assign(DEFAULT(), d);
    }catch(e){ return DEFAULT(); }
  }
  let saveTimer=null;
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){} }
  function saveDebounced(){ clearTimeout(saveTimer); saveTimer=setTimeout(save, 400); }
  function unit(u){
    if(!data.units[u]){
      data.units[u]={ modules:{}, lastAccessedAt:null };
      MODULES.forEach(m=>{ data.units[u].modules[m.key]={ completed:false, playCount:0, totalListenTime:0, lastPlayedAt:null }; });
    }
    // 兼容旧数据缺模块
    MODULES.forEach(m=>{ if(!data.units[u].modules[m.key]) data.units[u].modules[m.key]={completed:false,playCount:0,totalListenTime:0,lastPlayedAt:null}; });
    return data.units[u];
  }
  return {
    get data(){ return data; },
    get settings(){ return data.settings; },
    save, saveDebounced, unit,
    reset(){ data=DEFAULT(); save(); },
  };
})();

// ============================================================
//  ProgressTracker — 完成判定 / 每日统计 / streak
// ============================================================
const Progress = (()=>{
  function unitPct(u){
    const mod = Store.unit(u).modules;
    const done = MODULES.filter(m=>mod[m.key].completed).length;
    return Math.round(done/MODULES.length*100);
  }
  function unitDone(u){ return unitPct(u)===100; }
  function unitsCompleted(){ return UNITS.filter(unitDone).length; }
  function allDone(){ return unitsCompleted()===UNITS.length; }

  function markModuleComplete(u, key){
    const m = Store.unit(u).modules[key];
    if(m.completed) return false; // 已完成，不重复触发
    m.completed = true;
    m.lastPlayedAt = new Date().toISOString();
    Store.save();
    return true; // 本次新完成
  }
  function recordPlay(u, key){
    const m = Store.unit(u).modules[key];
    m.playCount++; m.lastPlayedAt=new Date().toISOString();
    Store.unit(u).lastAccessedAt=new Date().toISOString();
    Store.saveDebounced();
  }
  function addListenSeconds(u, key, sec){
    if(u===0){ Store.data.globalWordList.totalListenTime += sec; }
    else { Store.unit(u).modules[key].totalListenTime += sec; }
    addDailyStudy(sec);
    Store.saveDebounced();
  }
  // 每日统计 + streak
  function addDailyStudy(sec){
    const t=todayStr();
    const ds=Store.data.dailyStats;
    if(!ds[t]) ds[t]={ studySeconds:0, audiosCompleted:0, sessionsCount:0 };
    ds[t].studySeconds += sec;
    bumpStreak(t);
  }
  function bumpStreak(t){
    const s=Store.data.streaks;
    if(s.lastStudyDate===t) return;
    if(s.lastStudyDate && daysBetween(s.lastStudyDate,t)===1){ s.current++; }
    else { s.current=1; }
    if(s.current>s.longest) s.longest=s.current;
    s.lastStudyDate=t;
  }
  function todaySeconds(){ const d=Store.data.dailyStats[todayStr()]; return d?d.studySeconds:0; }
  function startSession(){
    const t=todayStr();
    const ds=Store.data.dailyStats;
    if(!ds[t]) ds[t]={ studySeconds:0, audiosCompleted:0, sessionsCount:0 };
    ds[t].sessionsCount++;
    Store.saveDebounced();
  }
  return { unitPct, unitDone, unitsCompleted, allDone, markModuleComplete, recordPlay, addListenSeconds, todaySeconds, startSession };
})();

// ============================================================
//  AudioManager — 全局唯一 audio 实例，跨页不中断
// ============================================================
const Audio_ = (()=>{
  const el = new Audio();
  el.preload='metadata';
  el.volume=0.8;
  let cur = null; // { unit, moduleKey, title, ico, isWordList }
  let listenAccumMs=0, lastTick=0, rafId=null;
  // AB 复读
  let abA=null, abB=null, loopSingle=false;

  function setRate(r){ el.playbackRate=r; Store.settings.defaultPlaybackRate=r; Store.save(); UI.syncSpeed(); }

  function load(track){
    const sameTrack = cur && cur.unit===track.unit && cur.moduleKey===track.moduleKey && cur.isWordList===track.isWordList;
    cur = track;
    if(!sameTrack){
      el.src = track.src;
      el.playbackRate = Store.settings.defaultPlaybackRate;
      abA=abB=null; UI.syncAB();
      // 记一次播放
      if(track.isWordList){ Store.data.globalWordList.playCount++; Store.saveDebounced(); }
      else { Progress.recordPlay(track.unit, track.moduleKey); }
    }
  }
  async function play(){
    try{ await el.play(); }
    catch(e){ UI.toast('点一下播放按钮开始 ▶'); }
  }
  function pause(){ el.pause(); }
  function toggle(){ if(el.paused) play(); else pause(); }
  function seek(frac){ if(el.duration) el.currentTime = frac*el.duration; }
  function skip(sec){ if(el.duration) el.currentTime = Math.max(0, Math.min(el.duration, el.currentTime+sec)); }

  // AB 复读
  function setA(){ abA = el.currentTime; if(abB!=null && abB<=abA) abB=null; UI.syncAB(); UI.toast('已设 A 点'); }
  function setB(){ if(abA==null){ UI.toast('请先设 A 点'); return; } abB=el.currentTime; if(abB<=abA){abB=null;UI.toast('B 点需在 A 点之后');return;} UI.syncAB(); UI.toast('A-B 复读开启'); }
  function clearAB(){ abA=abB=null; UI.syncAB(); UI.toast('已取消复读'); }
  function toggleLoop(){ loopSingle=!loopSingle; UI.syncLoop(); UI.toast(loopSingle?'单曲循环开':'单曲循环关'); }

  // 监听时长累计（只在播放时计）
  el.addEventListener('play', ()=>{ lastTick=performance.now(); loop(); UI.syncPlayState(); });
  el.addEventListener('pause', ()=>{ flushListen(); cancelAnimationFrame(rafId); UI.syncPlayState(); });
  el.addEventListener('ended', onEnded);
  el.addEventListener('timeupdate', ()=>{
    UI.syncProgress();
    // AB 复读
    if(abA!=null && abB!=null && el.currentTime>=abB){ el.currentTime=abA; }
  });
  el.addEventListener('loadedmetadata', ()=>UI.syncProgress());

  function loop(){
    const now=performance.now();
    if(!el.paused){ listenAccumMs += (now-lastTick); lastTick=now; }
    // 每满 5 秒落一次账
    if(listenAccumMs>=5000) flushListen();
    UI.syncWave();
    rafId=requestAnimationFrame(loop);
  }
  function flushListen(){
    const sec = Math.round(listenAccumMs/1000);
    if(sec>0 && cur){ Progress.addListenSeconds(cur.isWordList?0:cur.unit, cur.moduleKey, sec); UI.syncTopStats(); }
    listenAccumMs = listenAccumMs % 1000;
    lastTick=performance.now();
  }
  function onEnded(){
    flushListen();
    if(loopSingle){ el.currentTime=0; play(); return; }
    if(cur && !cur.isWordList){
      const isNew = Progress.markModuleComplete(cur.unit, cur.moduleKey);
      if(isNew){ RewardSys.onModuleComplete(cur.unit, cur.moduleKey); }
      // 自动推进
      if(Store.settings.autoAdvance){ Router.advanceNext(); }
    }
    UI.syncPlayState(); UI.syncProgress();
  }
  // ≥80% 阈值提前判完成（部分浏览器 ended 不稳）
  el.addEventListener('timeupdate', ()=>{
    if(!cur || cur.isWordList || !el.duration) return;
    if(el.currentTime/el.duration >= Store.settings.completionThreshold){
      const m=Store.unit(cur.unit).modules[cur.moduleKey];
      if(!m.completed){
        const isNew=Progress.markModuleComplete(cur.unit, cur.moduleKey);
        if(isNew) RewardSys.onModuleComplete(cur.unit, cur.moduleKey);
        UI.syncPathStates();
      }
    }
  });

  return {
    el, load, play, pause, toggle, seek, skip, setRate,
    setA, setB, clearAB, toggleLoop,
    get current(){ return cur; },
    get abA(){return abA;}, get abB(){return abB;}, get loopSingle(){return loopSingle;},
    flushListen,
  };
})();

// ============================================================
//  RewardSystem — 动画激励
// ============================================================
const RewardSys = (()=>{
  function starFly(x,y){
    const s=document.createElement('div'); s.className='star-fly'; s.textContent='⭐';
    s.style.left=(x-14)+'px'; s.style.top=(y-14)+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000);
  }
  function onModuleComplete(u,key){
    const mod=MODULES.find(m=>m.key===key);
    UI.toast(`✅ ${mod?mod.label:''} 完成！`);
    // 星星从屏幕中部飞
    const cx=innerWidth/2;
    for(let i=0;i<3;i++) setTimeout(()=>starFly(cx-30+i*30, innerHeight/2),i*120);
    UI.syncPathStates(); UI.syncTopStats();
    if(Progress.unitDone(u)) setTimeout(()=>onUnitComplete(u),700);
  }
  function onUnitComplete(u){
    confetti();
    UI.toast(`🎉 Unit ${u} 全部完成！`);
    if(Progress.allDone()) setTimeout(onAllComplete,1500);
  }
  function onAllComplete(){ confetti(2500); UI.toast('🎓 六个单元全部完成，太棒啦！'); }
  function confetti(dur){
    dur=dur||1600;
    const box=document.getElementById('confetti'); box.innerHTML=''; box.classList.add('show');
    const colors=['#4A98F8','#14CCAD','#F5A623','#EF5350','#AB7DF8'];
    for(let i=0;i<80;i++){
      const c=document.createElement('i');
      c.style.left=Math.random()*100+'%';
      c.style.background=colors[i%colors.length];
      c.style.animationDuration=(1.2+Math.random()*1.2)+'s';
      c.style.animationDelay=(Math.random()*0.4)+'s';
      box.appendChild(c);
    }
    setTimeout(()=>{ box.classList.remove('show'); box.innerHTML=''; }, dur);
  }
  return { onModuleComplete, onUnitComplete, confetti };
})();

// ============================================================
//  Router — hash 路由 + 页面渲染
// ============================================================
const Router = (()=>{
  const main=document.getElementById('main');
  let state={ view:'intro', unit:null, moduleKey:null };

  function go(view, opts){
    state=Object.assign({view}, opts||{});
    render();
    // 记录 lastSession
    if(view==='player' && state.unit){
      Store.data.lastSession={ unitId:state.unit, moduleType:state.moduleKey, audioCurrentTime:Audio_.el.currentTime||0, timestamp:new Date().toISOString() };
      Store.save();
    }
  }
  function advanceNext(){
    if(!state.unit) return;
    const idx=MODULES.findIndex(m=>m.key===state.moduleKey);
    if(idx<MODULES.length-1){
      const next=MODULES[idx+1];
      UI.toast(`下一个：${next.label}`);
      setTimeout(()=>openModule(state.unit, next.key, true), 900);
    }else{
      setTimeout(()=>go('unitLearn',{unit:state.unit}),900);
    }
  }
  function openModule(unit, key, autoplay){
    const mod=MODULES.find(m=>m.key===key);
    Audio_.load({ unit, moduleKey:key, title:`Unit ${unit} — ${mod.label}`, ico:mod.ico, isWordList:false, src:audioUrl(unit,key) });
    go('player',{unit, moduleKey:key});
    if(autoplay) Audio_.play();
  }

  function render(){
    const v=state.view;
    document.getElementById('header').style.display = v==='intro'?'none':'flex';
    document.getElementById('topStats').style.display = v==='units'?'flex':'none';
    document.getElementById('streakBadge').style.display = (v==='units')?'inline-block':'none';
    main.innerHTML='';
    if(v==='intro') main.appendChild(View.intro());
    else if(v==='units') main.appendChild(View.units());
    else if(v==='unitLearn') main.appendChild(View.unitLearn(state.unit));
    else if(v==='player') main.appendChild(View.player());
    else if(v==='wordlist') main.appendChild(View.wordlist());
    UI.syncTitle(); UI.syncTopStats(); UI.syncMini();
    main.scrollTop=0;
  }
  function back(){
    const v=state.view;
    if(v==='player') go('unitLearn',{unit:state.unit});
    else if(v==='unitLearn'||v==='wordlist') go('units');
    else if(v==='units') go('intro');
  }
  return { go, back, advanceNext, openModule, get state(){return state;} };
})();

// ============================================================
//  UI — DOM 同步（进度条、状态、统计、mini）
// ============================================================
const UI = (()=>{
  const $=(id)=>document.getElementById(id);
  function fmtTime(s){ s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800); }

  function syncTitle(){
    const v=Router.state.view;
    const map={ units:'英语听力', unitLearn:`Unit ${Router.state.unit}`, player:'正在学习', wordlist:'单词总表' };
    $('pageTitle').textContent = map[v]||'英语听力';
  }
  function syncTopStats(){
    const todayMin=Math.round(Progress.todaySeconds()/60);
    const goal=Store.settings.dailyGoalMinutes;
    $('stToday').textContent=todayMin;
    $('stGoalBar').style.width=Math.min(100,Math.round(todayMin/goal*100))+'%';
    $('stStreak').textContent=Store.data.streaks.current;
    $('stDone').textContent=Progress.unitsCompleted()+'/6';
    $('streakBadge').textContent=`🔥 ${Store.data.streaks.current} 天`;
  }
  function syncProgress(){
    const el=Audio_.el;
    const frac = el.duration? el.currentTime/el.duration : 0;
    const fill=$('seekFill'), thumb=$('seekThumb'), tc=$('tCur'), td=$('tDur');
    if(fill) fill.style.width=(frac*100)+'%';
    if(thumb) thumb.style.left=(frac*100)+'%';
    if(tc) tc.textContent=fmtTime(el.currentTime);
    if(td) td.textContent=el.duration?fmtTime(el.duration):'0:00';
    syncMini();
  }
  function syncPlayState(){
    const playing=!Audio_.el.paused;
    const bp=$('bigPlay'); if(bp){ bp.textContent=playing?'⏸':'▶'; bp.classList.toggle('playing',playing); }
    const mp=$('miniPlay'); if(mp) mp.textContent=playing?'⏸':'▶';
  }
  function syncSpeed(){
    document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('active', parseFloat(b.dataset.r)===Store.settings.defaultPlaybackRate));
  }
  function syncAB(){
    const z=$('abzone'); const btnB=$('btnB'); const el=Audio_.el;
    if(!z) return;
    if(Audio_.abA!=null && Audio_.abB!=null && el.duration){
      z.style.display='block';
      z.style.left=(Audio_.abA/el.duration*100)+'%';
      z.style.width=((Audio_.abB-Audio_.abA)/el.duration*100)+'%';
      if(btnB){ btnB.classList.add('active'); btnB.querySelector('.cl').textContent='清除AB'; }
    }else{
      z.style.display='none';
      if(btnB){ btnB.classList.remove('active'); btnB.querySelector('.cl').textContent='设B点'; }
    }
    const btnA=$('btnA'); if(btnA) btnA.classList.toggle('active', Audio_.abA!=null);
  }
  function syncLoop(){ const b=$('btnLoop'); if(b) b.classList.toggle('active', Audio_.loopSingle); }
  function syncPathStates(){ if(Router.state.view==='unitLearn'){ /* 重绘路径 */ Router.go('unitLearn',{unit:Router.state.unit}); } }
  function syncWave(){
    const w=$('wave'); if(!w) return;
    const playing=!Audio_.el.paused;
    w.querySelectorAll('.bar').forEach(b=>{ b.style.height=(playing?(15+Math.random()*85):20)+'%'; });
  }
  function syncMini(){
    const cur=Audio_.current;
    const mini=$('mini');
    const onPlayerPage = Router.state.view==='player'||Router.state.view==='wordlist';
    if(cur && !onPlayerPage){
      mini.classList.add('show');
      $('miniTitle').textContent=cur.title;
      $('miniIco').textContent=cur.ico;
      const el=Audio_.el; $('miniBar').style.width=(el.duration?el.currentTime/el.duration*100:0)+'%';
    }else{
      mini.classList.remove('show');
    }
  }
  return { fmtTime, toast, syncTitle, syncTopStats, syncProgress, syncPlayState, syncSpeed, syncAB, syncLoop, syncPathStates, syncWave, syncMini };
})();

// ============================================================
//  启动
// ============================================================
(function init(){
  // Header 返回 / mini 交互
  document.getElementById('backLink').addEventListener('click',()=>Router.back());
  document.getElementById('miniPlay').addEventListener('click',(e)=>{ e.stopPropagation(); Audio_.toggle(); });
  document.getElementById('mini').addEventListener('click',()=>{
    const cur=Audio_.current; if(!cur)return;
    if(cur.isWordList) Router.go('wordlist');
    else Router.go('player',{unit:cur.unit, moduleKey:cur.moduleKey});
  });

  // 应用默认倍速
  Audio_.el.playbackRate = Store.settings.defaultPlaybackRate;

  // 自动保存：每10秒 + 页面可见性变化
  setInterval(()=>{ if(!Audio_.el.paused){ Audio_.flushListen(); if(Audio_.current){ Store.data.lastSession={ unitId:Audio_.current.isWordList?0:Audio_.current.unit, moduleType:Audio_.current.moduleKey, audioCurrentTime:Audio_.el.currentTime, timestamp:new Date().toISOString() }; } Store.save(); } }, 10000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ Audio_.flushListen(); Store.save(); } });
  window.addEventListener('pagehide',()=>{ Audio_.flushListen(); Store.save(); });

  // 音频加载失败友好提示（音频还没放进服务器时）
  Audio_.el.addEventListener('error',()=>{ UI.toast('这节音频还没准备好，请稍后再试 🙏'); });

  // 入口：首次走引导，否则直接单元页
  if(Store.data.introDone){ Progress.startSession(); Router.go('units'); }
  else Router.go('intro');

  // Service Worker
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
})();
</script>
</body>
</html>
