<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>今日作业</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .header {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      padding: 20px 16px 16px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header .date {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .date-nav button {
      background: none;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }
    .date-nav button:active { background: #f0f0f0; }
    .date-nav .current-date {
      font-size: 15px;
      font-weight: 500;
      color: #333;
      min-width: 120px;
      text-align: center;
    }
    .content { padding: 12px 16px; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .subject-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .subject-icon.chinese { background: #fff0f0; }
    .subject-icon.math { background: #f0f0ff; }
    .subject-icon.english { background: #f0fff0; }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
    }
    .card-meta {
      font-size: 12px;
      color: #999;
    }
    .card-body {
      font-size: 14px;
      line-height: 1.8;
      color: #444;
      white-space: pre-wrap;
    }
    .card-footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
      font-size: 12px;
      color: #999;
      display: flex;
      justify-content: space-between;
    }
    .submit-tag {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .empty .text { font-size: 15px; }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ddd;
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #e53935;
    }
    .tts-btn {
      background: none;
      border: 1px solid #4facfe;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 12px;
      color: #4facfe;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .tts-btn:active { background: #f0f8ff; }
    .tts-btn.speaking {
      background: #4facfe;
      color: #fff;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .tts-speed-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      color: #666;
    }
    .tts-speed-bar .speed-btn {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 4px 14px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }
    .tts-speed-bar .speed-btn.active {
      background: #4facfe;
      border-color: #4facfe;
      color: #fff;
    }
    .tts-speed-bar .speed-label {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>今日作业</h1>
    <div class="date" id="headerDate"></div>
  </div>
  <div class="date-nav">
    <button id="prevBtn">&#8592; 前一天</button>
    <div class="current-date" id="dateLabel"></div>
    <button id="nextBtn">后一天 &#8594;</button>
  </div>
  <div class="tts-speed-bar">
    <span class="speed-label">朗读速度</span>
    <button class="speed-btn" data-action="tts-speed" data-speed="0.6">慢</button>
    <button class="speed-btn active" data-action="tts-speed" data-speed="0.85">中</button>
    <button class="speed-btn" data-action="tts-speed" data-speed="1.0">快</button>
  </div>
  <div class="content" id="content">
    <div class="loading">加载中</div>
  </div>

  <script>
    const SUBJECT_MAP = {
      '语文': { icon: '📖', cls: 'chinese', label: '语文' },
      '数学': { icon: '🔢', cls: 'math', label: '数学' },
      '英语': { icon: '🔤', cls: 'english', label: '英语' },
    };

    let currentDate = todayStr();

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDate(s) {
      const [y, m, d] = s.split('-');
      const weekdays = ['日','一','二','三','四','五','六'];
      const dt = new Date(+y, +m - 1, +d);
      return `${m}月${d}日 周${weekdays[dt.getDay()]}`;
    }

    function shiftDate(offset) {
      const [y, m, d] = currentDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d + offset);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    }

    async function loadHomework(date) {
      const content = document.getElementById('content');
      const dateLabel = document.getElementById('dateLabel');
      const headerDate = document.getElementById('headerDate');

      dateLabel.textContent = formatDate(date);
      headerDate.textContent = formatDate(date);
      content.innerHTML = '<div class="loading">加载中</div>';

      try {
        const res = await fetch(`/api/homework?date=${date}`);
        const data = await res.json();

        if (data.error) {
          content.innerHTML = `<div class="error">加载失败：${data.error}</div>`;
          return;
        }

        if (!data.items || data.items.length === 0) {
          content.innerHTML = `
            <div class="empty">
              <div class="icon">🎉</div>
              <div class="text">今天没有作业任务，好好休息吧！</div>
            </div>`;
          return;
        }

        let html = '';
        for (let i = 0; i < data.items.length; i++) {
          const item = data.items[i];
          const subj = SUBJECT_MAP[item.subject] || { icon: '📋', cls: '', label: item.subject };
          const contentText = (item.content || '').replace(/\\n/g, '\n');
          html += `
            <div class="card" data-card-index="${i}" data-content="${encodeURIComponent(contentText)}">
              <div class="card-header">
                <div class="subject-icon ${subj.cls}">${subj.icon}</div>
                <div class="card-title">${subj.label}</div>
                <div class="card-meta">${item.teacher || ''}</div>
                <button class="tts-btn" data-action="tts-read" data-card-index="${i}">
                  <span class="tts-icon">🔊</span>朗读
                </button>
              </div>
              <div class="card-body">${escapeHtml(contentText)}</div>
              <div class="card-footer">
                <span>截止：${item.deadline || '-'}</span>
                ${item.submitMethod ? `<span class="submit-tag">提交：${item.submitMethod}</span>` : ''}
              </div>
            </div>`;
        }
        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = `<div class="error">网络错误：${err.message}</div>`;
      }
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
    }

    // Navigation
    document.getElementById('prevBtn').addEventListener('click', () => {
      stopSpeaking();
      currentDate = shiftDate(-1);
      loadHomework(currentDate);
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      stopSpeaking();
      currentDate = shiftDate(1);
      loadHomework(currentDate);
    });

    // --- TTS (Web Speech API) ---
    let ttsSpeed = 0.85;
    let zhVoice = null;
    let currentUtterance = null;
    let currentBtnEl = null;

    function findChineseVoice() {
      const voices = speechSynthesis.getVoices();
      // Prefer female zh-CN voice
      zhVoice = voices.find(v => v.lang === 'zh-CN' && /female/i.test(v.name))
        || voices.find(v => v.lang === 'zh-CN')
        || voices.find(v => v.lang.startsWith('zh'))
        || null;
    }
    // Voices may load asynchronously
    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = findChineseVoice;
      findChineseVoice();
    }

    function stopSpeaking() {
      if (typeof speechSynthesis !== 'undefined') {
        speechSynthesis.cancel();
      }
      if (currentBtnEl) {
        currentBtnEl.classList.remove('speaking');
        const icon = currentBtnEl.querySelector('.tts-icon');
        if (icon) icon.textContent = '🔊';
        currentBtnEl = null;
      }
      currentUtterance = null;
    }

    function speakText(text, btnEl) {
      if (typeof speechSynthesis === 'undefined') {
        alert('当前浏览器不支持语音朗读');
        return;
      }
      // Re-check voice
      if (!zhVoice) findChineseVoice();

      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'zh-CN';
      utt.rate = ttsSpeed;
      if (zhVoice) utt.voice = zhVoice;

      utt.onstart = () => {
        if (btnEl) {
          btnEl.classList.add('speaking');
          const icon = btnEl.querySelector('.tts-icon');
          if (icon) icon.textContent = '⏸';
          currentBtnEl = btnEl;
        }
      };
      utt.onend = () => {
        if (btnEl) {
          btnEl.classList.remove('speaking');
          const icon = btnEl.querySelector('.tts-icon');
          if (icon) icon.textContent = '🔊';
        }
        currentBtnEl = null;
        currentUtterance = null;
      };
      utt.onerror = utt.onend;

      currentUtterance = utt;
      speechSynthesis.speak(utt);
    }

    // Event delegation (CSP-safe, no inline onclick)
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'tts-read') {
        const card = document.querySelector(`.card[data-card-index="${target.dataset.cardIndex}"]`);
        if (!card) return;
        const text = decodeURIComponent(card.dataset.content || '');
        if (!text.trim()) return;
        // If clicking same button while speaking, toggle off
        if (currentBtnEl === target && speechSynthesis.speaking) {
          stopSpeaking();
          return;
        }
        stopSpeaking();
        speakText(text, target);
      }

      if (action === 'tts-speed') {
        ttsSpeed = parseFloat(target.dataset.speed) || 0.85;
        document.querySelectorAll('.tts-speed-bar .speed-btn').forEach(b => b.classList.remove('active'));
        target.classList.add('active');
      }
    });

    // Init
    loadHomework(currentDate);
  </script>
</body>
</html>
