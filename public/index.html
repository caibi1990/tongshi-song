<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>明悦三班</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header p {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      margin-top: 6px;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }
    @media (max-width: 380px) {
      .cards { grid-template-columns: 1fr; }
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .card:active {
      transform: scale(0.96);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .card-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .card-icon.homework {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }
    .card-icon.poetry {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #333;
    }
    .card-desc {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
    }
    .footer {
      margin-top: auto;
      padding-top: 40px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>明悦三班</h1>
    <p>一年级3班 · 学习助手</p>
  </div>
  <div class="cards">
    <a class="card" href="/homework.html">
      <div class="card-icon homework">📋</div>
      <div class="card-title">今日作业</div>
      <div class="card-desc">查看每天各科<br>作业内容</div>
    </a>
    <a class="card" href="/poetry.html">
      <div class="card-icon poetry">📜</div>
      <div class="card-title">古诗背诵</div>
      <div class="card-desc">116首必背古诗<br>朗读打卡</div>
    </a>
  </div>
  <div class="footer">彭泽恩的学习小站</div>
</body>
</html>
