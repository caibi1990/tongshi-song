<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>明悦三班</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      padding-top: max(40px, env(safe-area-inset-top, 20px));
      padding-bottom: max(40px, env(safe-area-inset-bottom, 20px));
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header p {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      margin-top: 6px;
    }
    .cards {
      --card-gap: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--card-gap);
      width: 100%;
      max-width: 400px;
    }
    /* 卡片数为奇数时，最后一张保持与其它卡片等宽并整行居中 */
    .cards .card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      width: calc(50% - var(--card-gap) / 2);
      justify-self: center;
    }
    @media (max-width: 380px) {
      .cards { grid-template-columns: 1fr; }
      .cards .card:last-child:nth-child(odd) {
        grid-column: auto;
        width: 100%;
      }
    }
    /* iPad & Tablet — 儿童友好大字模式 */
    @media (min-width: 768px) {
      body { padding: 60px 40px; }
      .header { margin-bottom: 56px; }
      .header h1 { font-size: 42px; }
      .header p { font-size: 20px; margin-top: 10px; }
      .cards { max-width: 640px; --card-gap: 28px; }
      .card { padding: 44px 36px; border-radius: 28px; gap: 16px; }
      .card-icon { width: 96px; height: 96px; font-size: 48px; border-radius: 26px; }
      .card-title { font-size: 24px; }
      .card-desc { font-size: 17px; line-height: 1.6; }
      .footer { font-size: 15px; padding-top: 56px; }
    }
    /* iPad Pro / 大平板 */
    @media (min-width: 1024px) {
      .header h1 { font-size: 48px; }
      .header p { font-size: 22px; }
      .cards { max-width: 720px; --card-gap: 32px; }
      .card { padding: 52px 44px; }
      .card-icon { width: 108px; height: 108px; font-size: 54px; }
      .card-title { font-size: 28px; }
      .card-desc { font-size: 19px; }
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .card:active {
      transform: scale(0.96);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .card-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .card-icon.homework {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }
    .card-icon.poetry {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }
    .card-icon.jumprope {
      background: linear-gradient(135deg, #ff6b35, #ff9a5c);
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #333;
    }
    .card-desc {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
    }
    .footer {
      margin-top: auto;
      padding-top: 40px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>明悦三班</h1>
    <p>学习助手</p>
  </div>
  <div class="cards">
    <a class="card" href="/homework.html">
      <div class="card-icon homework">📋</div>
      <div class="card-title">今日作业</div>
      <div class="card-desc">查看每天各科<br>作业内容</div>
    </a>
    <a class="card" href="/poetry.html">
      <div class="card-icon poetry">📜</div>
      <div class="card-title">古诗背诵</div>
      <div class="card-desc">116首必背古诗<br>朗读打卡</div>
    </a>
    <a class="card" href="/jump-rope.html">
      <div class="card-icon jumprope">🏃</div>
      <div class="card-title">跳绳打卡</div>
      <div class="card-desc">每日跳绳任务<br>计时计数记录</div>
    </a>
  </div>
  <div class="footer">彭泽恩的学习小站</div>
</body>
</html>
